[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbook-signals"
version = "0.1.0"
description = "Reproducible limit order book signal research with chronological evaluation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "xgboost>=2.1", "matplotlib>=3.9", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "nbconvert>=7"]

[project.scripts]
lob-research = "lob_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

